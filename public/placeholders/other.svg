<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="100%" stop-color="#111827" />
    </radialGradient>
  </defs>
  <rect fill="url(#bg)" width="800" height="600"/>
  <!-- Calendar icon -->
  <g transform="translate(400,285)" fill="none" stroke="#9ca3af" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
    <rect x="-55" y="-50" width="110" height="100" rx="10" fill="#9ca3af" fill-opacity="0.1"/>
    <rect x="-55" y="-50" width="110" height="100" rx="10"/>
    <!-- Top bar -->
    <line x1="-55" y1="-20" x2="55" y2="-20"/>
    <!-- Hanging tabs -->
    <line x1="-25" y1="-65" x2="-25" y2="-45"/>
    <line x1="25" y1="-65" x2="25" y2="-45"/>
    <!-- Date dots -->
    <circle cx="-25" cy="5" r="5" fill="#9ca3af" opacity="0.5"/>
    <circle cx="0" cy="5" r="5" fill="#9ca3af" opacity="0.5"/>
    <circle cx="25" cy="5" r="5" fill="#9ca3af" opacity="0.5"/>
    <circle cx="-25" cy="30" r="5" fill="#9ca3af" opacity="0.3"/>
    <circle cx="0" cy="30" r="5" fill="#9ca3af" opacity="0.3"/>
  </g>
</svg>
