<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#111827" />
    </radialGradient>
  </defs>
  <rect fill="url(#bg)" width="800" height="600"/>
  <!-- Fork and knife -->
  <g transform="translate(400,300)" fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
    <!-- Fork -->
    <g transform="translate(-50,0)">
      <line x1="0" y1="-80" x2="0" y2="80"/>
      <line x1="-18" y1="-80" x2="-18" y2="-30"/>
      <line x1="0" y1="-80" x2="0" y2="-30"/>
      <line x1="18" y1="-80" x2="18" y2="-30"/>
      <path d="M-18,-30 Q-18,-10 0,-10 Q18,-10 18,-30" fill="none"/>
    </g>
    <!-- Knife -->
    <g transform="translate(50,0)">
      <line x1="0" y1="0" x2="0" y2="80"/>
      <path d="M0,-80 Q20,-60 20,-20 Q20,0 0,0" fill="#f97316" opacity="0.3"/>
      <path d="M0,-80 Q20,-60 20,-20 Q20,0 0,0" fill="none"/>
    </g>
  </g>
</svg>
