  <g transform="translate(400,290)" fill="none" stroke-linecap="round" opacity="0.5">
    <!-- Center starburst -->
    <g stroke="#6366f1" stroke-width="4">
      <line x1="0" y1="-15" x2="0" y2="-55"/>
      <line x1="0" y1="15" x2="0" y2="55"/>
      <line x1="-15" y1="0" x2="-55" y2="0"/>
      <line x1="15" y1="0" x2="55" y2="0"/>
      <line x1="-10" y1="-10" x2="-38" y2="-38"/>
      <line x1="10" y1="-10" x2="38" y2="-38"/>
      <line x1="-10" y1="10" x2="-38" y2="38"/>
      <line x1="10" y1="10" x2="38" y2="38"/>
    </g>
    <!-- Sparkle dots -->
    <circle cx="0" cy="-62" r="4" fill="#6366f1" opacity="0.7"/>
    <circle cx="0" cy="62" r="4" fill="#6366f1" opacity="0.7"/>
    <circle cx="-62" cy="0" r="4" fill="#6366f1" opacity="0.7"/>
    <circle cx="62" cy="0" r="4" fill="#6366f1" opacity="0.7"/>
    <circle cx="-44" cy="-44" r="3" fill="#a78bfa" opacity="0.6"/>
    <circle cx="44" cy="-44" r="3" fill="#a78bfa" opacity="0.6"/>
    <circle cx="-44" cy="44" r="3" fill="#a78bfa" opacity="0.6"/>
    <circle cx="44" cy="44" r="3" fill="#a78bfa" opacity="0.6"/>
    <!-- Small extra sparkles -->
    <circle cx="-70" cy="-30" r="2.5" fill="#c4b5fd" opacity="0.4"/>
    <circle cx="65" cy="35" r="2.5" fill="#c4b5fd" opacity="0.4"/>
    <circle cx="30" cy="-70" r="2" fill="#c4b5fd" opacity="0.4"/>
    <circle cx="-35" cy="65" r="2" fill="#c4b5fd" opacity="0.4"/>
